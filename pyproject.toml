[project]
name = "sia-eval-harness"
version = "0.1.0"
description = "Reproducible run receipts for SIA — separate harness gains, weight gains, and overfit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sia-eval = "sia_eval_harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sia_eval_harness*"]
